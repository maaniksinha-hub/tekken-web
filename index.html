<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browser-based 3D fighting game inspired by Tekken 8 mechanics. 2 players, PS5 controller support." />
    <title>Tekken Web</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="hud" hidden>
      <div class="top">
        <div class="side" id="side0">
          <div class="nameline"><span id="name0"></span><span class="pips" id="pips0"></span></div>
          <div class="bar hp"><div class="trail" id="trail0"></div><div class="fill" id="hp0"></div></div>
          <div class="bar heat"><div class="fill" id="heat0"></div></div>
          <div class="tag" id="tag0"></div>
        </div>
        <div id="timer">60</div>
        <div class="side right" id="side1">
          <div class="nameline"><span class="pips" id="pips1"></span><span id="name1"></span></div>
          <div class="bar hp"><div class="trail" id="trail1"></div><div class="fill" id="hp1"></div></div>
          <div class="bar heat"><div class="fill" id="heat1"></div></div>
          <div class="tag" id="tag1"></div>
        </div>
      </div>
      <div class="combo" id="combo0"></div>
      <div class="combo right" id="combo1"></div>
      <div id="banner"></div>
      <div id="hint"></div>
    </div>
    <div id="padstatus" role="status" aria-live="polite"></div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
