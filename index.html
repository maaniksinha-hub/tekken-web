<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tekken Web</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
      #game { width: 100%; height: 100%; display: block; outline: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      .bars { display: flex; align-items: center; gap: 16px; padding: 16px 24px; }
      .bar { flex: 1; height: 22px; background: #2a2a33; border: 2px solid #fff; transform-origin: center; }
      .bar > div { height: 100%; background: #f5c542; transition: width 0.1s; }
      #bar1 { transform: scaleX(-1); }
      #timer { font-size: 32px; font-weight: 700; width: 64px; text-align: center; }
      .names { display: flex; justify-content: space-between; padding: 0 24px; font-weight: 600; letter-spacing: 1px; }
      #banner { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 64px; font-weight: 800; text-shadow: 0 4px 16px #000; }
      #help { position: absolute; bottom: 12px; width: 100%; text-align: center; font-size: 13px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="hud">
      <div class="bars">
        <div class="bar" id="bar1"><div></div></div>
        <div id="timer">60</div>
        <div class="bar"><div></div></div>
      </div>
      <div class="names"><span id="name0"></span><span id="name1"></span></div>
      <div id="banner"></div>
      <div id="help">
        P1: WASD move (W/S = sidestep) · F G V B = 1 2 3 4 · hold back to block · hold down to crouch · d/f+2, d+4, f,f+1 = specials &nbsp;|&nbsp;
        P2: Arrows · U I J K = 1 2 3 4 &nbsp;|&nbsp; PS5 pads: d-pad/stick · □ △ ✕ ○ = 1 2 3 4 · R to restart
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
